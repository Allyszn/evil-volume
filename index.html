Replace the contents of `index.html` with this:

```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do List</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #292b47;
      color: #eceae3;
      font: 16px/1.5 ui-monospace, monospace;
    }

    main {
      width: min(400px, calc(100% - 40px));
      padding: 24px;
      background: #23243d;
      border-radius: 12px;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 0;
      border-radius: 6px;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      color: inherit;
      background: #51537f;
      cursor: pointer;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 8px;
      background: #3f4168;
      border-radius: 6px;
    }

    li.completed span {
      text-decoration: line-through;
      opacity: 0.6;
    }

    li span {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>To-do List</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add a task" required>
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
  </main>

  <script>
    const form = document.querySelector("#todo-form");
    const input = document.querySelector("#todo-input");
    const list = document.querySelector("#todo-list");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const item = document.createElement("li");
      const text = document.createElement("span");
      const remove = document.createElement("button");

      text.textContent = input.value;
      remove.textContent = "Remove";

      text.addEventListener("click", () => item.classList.toggle("completed"));
      remove.addEventListener("click", () => item.remove());

      item.append(text, remove);
      list.append(item);
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
```
