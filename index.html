<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my evil input</title>
<style>
  /* Everything you make goes inside #stage: exactly 800 × 400 pixels. The gallery shows
     this box (shrunk to fit), so anything outside it won't be seen. */
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #stage {
    --bg: #23243d; --fg: #eceae3;
    --line: color-mix(in srgb, var(--fg) 16%, transparent);
    --soft: color-mix(in srgb, var(--fg) 9%, transparent);
    --dim: color-mix(in srgb, var(--fg) 55%, transparent);
    width: 800px; height: 400px; overflow: hidden; position: relative;
    display: flex; background: var(--bg); color: var(--fg);
    font-size: 14px; line-height: 1.5;
    transition: background-color .25s, color .25s;
  }
  #stage * { box-sizing: border-box; }
  #stage button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #stage button:focus-visible, #stage input:focus-visible { outline: 2px solid var(--dim); outline-offset: 1px; }
  #list, #body { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  /* ---- sidebar: note list ---- */
  #side { width: 172px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--fg) 4%, transparent); }
  #side header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 14px; color: var(--dim); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  #add { width: 24px; height: 24px; border-radius: 6px; font-size: 18px; line-height: 1; }
  #add:hover { background: var(--soft); }
  #list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
  .note { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 8px; border-radius: 6px; cursor: pointer; }
  .note:hover { background: var(--soft); }
  .note.on { background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .note span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stage .note .del { opacity: 0; min-width: 20px; height: 20px; border-radius: 4px; font-size: 14px; line-height: 1; color: var(--dim); flex: none; }
  .note:hover .del, .note .del.arm { opacity: 1; }
  #stage .note .del:hover { background: var(--soft); color: var(--fg); }
  #stage .note .del.arm { padding: 0 6px; font-size: 11px; color: #e5484d; }

  /* ---- editor ---- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #title { font: inherit; font-size: 24px; font-weight: 700; color: inherit; background: transparent; border: 0; outline: 0; padding: 16px 22px 6px; width: 100%; }
  #title::placeholder { color: var(--dim); }
  #tools { display: flex; align-items: center; gap: 2px; padding: 0 18px 6px; border-bottom: 1px solid var(--line); }
  #stage #tools button { min-width: 28px; height: 26px; padding: 0 6px; border-radius: 6px; font-size: 13px; }
  #stage #tools button:hover { background: var(--soft); }
  #stage #tools button.on { background: color-mix(in srgb, var(--fg) 18%, transparent); }
  #tools .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; }
  #body { flex: 1; overflow-y: auto; padding: 12px 22px; outline: 0; line-height: 1.65; overflow-wrap: anywhere; }
  #body.empty::before { content: attr(data-ph); float: left; height: 0; color: var(--dim); pointer-events: none; }
  #body > :first-child { margin-top: 0; }
  #body h1 { font-size: 20px; line-height: 1.3; margin: .7em 0 .2em; }
  #body h2 { font-size: 16px; line-height: 1.3; margin: .7em 0 .2em; }
  #body ul { margin: .3em 0; padding-left: 22px; }

  /* ---- footer: background colors ---- */
  #foot { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  #stage .sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); padding: 0; flex: none; }
  #stage .sw.on { outline: 2px solid var(--fg); outline-offset: 2px; }
  #pick { width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
  #pick::-webkit-color-swatch-wrapper { padding: 0; }
  #pick::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 50%; }
  #pick::-moz-color-swatch { border: 1px solid var(--line); border-radius: 50%; }
  #count { margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <aside id="side">
    <header>notes <button id="add" title="New note">+</button></header>
    <div id="list"></div>
  </aside>

  <section id="main">
    <input id="title" type="text" placeholder="Untitled" spellcheck="false" autocomplete="off">
    <div id="tools">
      <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Italic (Ctrl+I)"><em>I</em></button>
      <span class="sep"></span>
      <button data-cmd="h1" title="Big heading">H1</button>
      <button data-cmd="h2" title="Small heading">H2</button>
      <button data-cmd="ul" title="Bullet list">&bull; List</button>
    </div>
    <div id="body" contenteditable="true" data-ph="start writing…" spellcheck="true"></div>
    <div id="foot">
      <span>background</span>
      <span id="swatches" style="display:contents"></span>
      <input id="pick" type="color" title="Custom color">
      <span id="count"></span>
    </div>
  </section>
</div>

<script>
(() => {
  const KEY = 'papier-lite-v1';
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), listEl = $('#list'), titleEl = $('#title'), bodyEl = $('#body');
  const countEl = $('#count'), picker = $('#pick'), swWrap = $('#swatches'), toolsEl = $('#tools');
  const COLORS = ['#23243d', '#1c1c1e', '#f6f1e7', '#fff4b8', '#d8ecd2', '#cfe2f3', '#f3d5d9'];
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const blank = (title = '', html = '') => ({ id: uid(), title, html });

  /* ---------- state (saved in this browser) ---------- */
  let state = null;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!state || !Array.isArray(state.notes) || !state.notes.length) {
    const n = blank('Welcome',
      '<h2>Edit me</h2>' +
      '<div>Click the title above to rename this note.</div>' +
      '<div>Pick a background below &mdash; the text color adapts to it.</div>' +
      '<ul><li>B, I, headings and lists are in the toolbar</li><li>Everything saves as you type</li></ul>');
    state = { bg: COLORS[0], current: n.id, notes: [n] };
  }
  const cur = () => state.notes.find(n => n.id === state.current) || state.notes[0];

  let timer = null, status = 'saved';
  function save() {
    status = 'saving…'; updateCount();
    clearTimeout(timer);
    timer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); status = 'saved'; }
      catch (e) { status = 'not saved'; }
      updateCount();
    }, 300);
  }

  /* ---------- background color ---------- */
  const isLight = hex => {
    const n = parseInt(hex.slice(1), 16);
    return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 > 0.6;
  };
  function applyBg(hex) {
    state.bg = hex;
    stage.style.setProperty('--bg', hex);
    stage.style.setProperty('--fg', isLight(hex) ? '#222222' : '#eceae3');
    picker.value = hex;
    swWrap.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === hex));
  }
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'sw'; b.dataset.c = c; b.title = c; b.style.background = c;
    b.addEventListener('click', () => { applyBg(c); save(); });
    swWrap.append(b);
  });
  picker.addEventListener('input', () => { applyBg(picker.value); save(); });

  /* ---------- note list ---------- */
  function renderList() {
    listEl.textContent = '';
    state.notes.forEach(n => {
      const row = document.createElement('div');
      row.className = 'note' + (n.id === state.current ? ' on' : '');
      const label = document.createElement('span');
      label.textContent = n.title.trim() || 'Untitled';
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '×'; del.title = 'Delete note';
      row.append(label, del);
      row.addEventListener('click', e => { if (e.target !== del) select(n.id); });
      del.addEventListener('click', () => {
        if (!del.classList.contains('arm')) {   // first click arms, second click deletes
          del.classList.add('arm'); del.textContent = 'delete?';
          setTimeout(() => { del.classList.remove('arm'); del.textContent = '×'; }, 2000);
          return;
        }
        remove(n.id);
      });
      listEl.append(row);
    });
  }
  function load() {
    const n = cur();
    state.current = n.id;
    titleEl.value = n.title;
    bodyEl.innerHTML = n.html;
    syncEmpty(); renderList(); updateCount(); updateTools();
  }
  function select(id) { state.current = id; load(); save(); }
  function add() {
    const n = blank();
    state.notes.unshift(n); state.current = n.id;
    load(); titleEl.focus(); save();
  }
  function remove(id) {
    const i = state.notes.findIndex(n => n.id === id);
    state.notes.splice(i, 1);
    if (!state.notes.length) state.notes.push(blank());
    if (state.current === id) state.current = state.notes[Math.min(i, state.notes.length - 1)].id;
    load(); save();
  }
  $('#add').addEventListener('click', add);

  /* ---------- title + body ---------- */
  function syncEmpty() {
    bodyEl.classList.toggle('empty', !bodyEl.textContent.trim() && !bodyEl.querySelector('li'));
  }
  function updateCount() {
    const words = (bodyEl.innerText || '').trim().split(/\s+/).filter(Boolean).length;
    countEl.textContent = words + (words === 1 ? ' word' : ' words') + ' · ' + status;
  }
  titleEl.addEventListener('input', () => {
    cur().title = titleEl.value;
    const label = listEl.querySelector('.note.on span');
    if (label) label.textContent = titleEl.value.trim() || 'Untitled';
    save();
  });
  titleEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); bodyEl.focus(); }
  });
  bodyEl.addEventListener('input', () => {
    cur().html = bodyEl.innerHTML;
    syncEmpty(); save();
  });
  bodyEl.addEventListener('paste', e => {   // paste as plain text, no junk formatting
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });

  /* ---------- toolbar ---------- */
  toolsEl.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  toolsEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    bodyEl.focus();
    const c = b.dataset.cmd;
    if (c === 'bold' || c === 'italic') document.execCommand(c);
    else if (c === 'ul') document.execCommand('insertUnorderedList');
    else {
      const on = (document.queryCommandValue('formatBlock') || '').toLowerCase() === c;
      document.execCommand('formatBlock', false, '<' + (on ? 'div' : c) + '>');
    }
    cur().html = bodyEl.innerHTML;
    syncEmpty(); save(); updateTools();
  });
  function updateTools() {
    const sel = document.getSelection();
    if (!sel || !sel.anchorNode || !bodyEl.contains(sel.anchorNode)) return;
    const block = (document.queryCommandValue('formatBlock') || '').toLowerCase();
    toolsEl.querySelectorAll('button').forEach(b => {
      const c = b.dataset.cmd;
      let on = false;
      try {
        if (c === 'bold' || c === 'italic') on = document.queryCommandState(c);
        else if (c === 'ul') on = document.queryCommandState('insertUnorderedList');
        else on = block === c;
      } catch (e) {}
      b.classList.toggle('on', on);
    });
  }
  document.addEventListener('selectionchange', updateTools);

  /* ---------- go ---------- */
  applyBg(state.bg || COLORS[0]);
  load();
})();
</script>
</body>
</html>
